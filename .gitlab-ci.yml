stages:
  - test
  - report

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

test-correctness:
  stage: test
  image: python:3.8
  before_script:
    - pip install -r requirements.txt
  script:
    - echo "Running correctness tests..."
    - python -m unittest discover -s tests -p "test_*.py" -v
    - echo "Running benchmark validation tests..."
    - python -m unittest tests.test_benchmarks -v
    - echo "Running report correctness tests..."
    - python -m unittest tests.test_report_correctness -v
    - echo "Running data loader tests..."
    - python -m unittest tests.test_data_loader -v
    - coverage run -m unittest discover -s tests -p "test_*.py"
    - coverage run -a -m unittest tests.test_benchmarks tests.test_report_correctness tests.test_data_loader
    - coverage report
    - coverage xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
      - .coverage
    expire_in: 1 week

test-performance:
  stage: test
  image: python:3.8
  before_script:
    - pip install -r requirements.txt
  script:
    - echo "Running performance tests (may take longer)..."
    - python -m unittest discover -s tests/performance -v
  allow_failure: true
  artifacts:
    paths:
      - test-results/
    expire_in: 1 week

coverage-report:
  stage: report
  image: python:3.8
  dependencies:
    - test
  before_script:
    - pip install coverage
  script:
    - coverage html
  artifacts:
    paths:
      - htmlcov/
    expire_in: 1 week
  only:
    - main
    - master
